name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: agentic_shortener
          POSTGRES_USER: agentic_app
          POSTGRES_PASSWORD: agentic_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U agentic_app -d agentic_shortener"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/agentic_shortener
      SPRING_DATASOURCE_USERNAME: agentic_app
      SPRING_DATASOURCE_PASSWORD: agentic_test_password
      PUBLIC_BASE_URL: http://localhost:8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests and package
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload application JAR
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: application-jar
          path: target/agentic-url-shortener-*.jar
          if-no-files-found: error
          retention-days: 14

  container:
    name: Verify container image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agentic-url-shortener:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max